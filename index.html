<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Welcome Back</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@200;400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --bg: #0a0e17;
      --bg-card: #111827;
      --fg: #e8ecf4;
      --muted: #6b7a94;
      --accent: #00e5a0;
      --accent-dim: rgba(0,229,160,0.12);
      --border: #1e293b;
      --input-bg: #0d1321;
      --error: #ff4d6a;
      --glow: rgba(0,229,160,0.25);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html, body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--fg);
      height: 100%;
      min-height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* Арын blob */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.3;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, #00e5a0 0%, transparent 70%);
      top: -120px; left: -80px;
      animation: bf1 12s ease-in-out infinite;
    }
    .blob-2 {
      width: 280px; height: 280px;
      background: radial-gradient(circle, #0077ff 0%, transparent 70%);
      bottom: -80px; right: -40px;
      animation: bf2 15s ease-in-out infinite;
    }
    .blob-3 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, #00e5a0 0%, transparent 70%);
      top: 50%; right: 20%;
      opacity: 0.12;
      animation: bf3 10s ease-in-out infinite;
    }
    @keyframes bf1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(40px,30px) scale(1.12)} }
    @keyframes bf2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-35px,-25px) scale(1.08)} }
    @keyframes bf3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(20px,-35px) scale(0.9)} }

    /* Lottie panel shimmer */
    .lottie-panel { position: relative; overflow: hidden; }
    .lottie-panel::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, transparent 30%, rgba(0,229,160,0.04) 50%, transparent 70%);
      background-size: 200% 200%;
      animation: shimmer 6s ease-in-out infinite;
      z-index: 1; pointer-events: none;
    }
    @keyframes shimmer { 0%,100%{background-position:0% 0%} 50%{background-position:100% 100%} }

    #lottie-container {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    #lottie-container svg { max-width: 340px !important; max-height: 340px !important; }

    /* Deco ring */
    .deco-ring {
      position: absolute;
      border: 1px solid rgba(0,229,160,0.07);
      border-radius: 50%;
      pointer-events: none;
    }

    /* ===== УТАСНЫ ХЭМЖЭЭ ===== */
    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr !important;
        grid-template-rows: auto 1fr;
        max-width: 420px !important;
        margin: 0 auto;
      }
      .lottie-panel {
        min-height: 200px !important;
        padding: 24px 16px 16px !important;
      }
      #lottie-container svg {
        max-width: 180px !important;
        max-height: 180px !important;
      }
      .deco-ring { display: none; }
      .form-panel {
        padding: 20px 20px 28px !important;
      }
      .form-panel h1 {
        font-size: 26px !important;
      }
      .form-panel .sub-text {
        font-size: 13px !important;
      }
    }

    @media (max-height: 680px) and (max-width: 900px) {
      .lottie-panel {
        min-height: 140px !important;
        padding: 16px 12px 8px !important;
      }
      #lottie-container svg {
        max-width: 120px !important;
        max-height: 120px !important;
      }
      .lottie-hint { display: none !important; }
      .form-panel { padding: 16px 18px 20px !important; }
      .form-panel h1 { font-size: 22px !important; margin-bottom: 4px !important; }
      .form-panel .sub-text { display: none; }
      .input-field { padding: 11px 14px 11px 42px !important; }
      .remember-row { margin-bottom: 12px !important; }
      .divider-row { margin: 12px 0 !important; }
      .social-row { margin-bottom: 12px !important; }
    }

    @media (max-width: 360px) {
      .form-panel { padding: 16px 14px 24px !important; }
      .form-panel h1 { font-size: 24px !important; }
    }

    /* Input */
    .input-field {
      width: 100%;
      padding: 14px 14px 14px 46px;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--fg);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px; /* iOS zoom сэргээхгүйн тулд */
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      -webkit-appearance: none;
    }
    .input-field::placeholder { color: var(--muted); font-weight: 300; font-size: 14px; }
    .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim), 0 0 20px var(--glow);
    }
    .input-field.error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(255,77,106,0.12);
    }

    .input-icon {
      position: absolute; left: 15px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted); font-size: 15px;
      transition: color 0.3s; pointer-events: none;
    }
    .input-wrap:focus-within .input-icon { color: var(--accent); }

    .toggle-pw {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      font-size: 15px; padding: 6px;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--accent); }

    /* Button */
    .btn-login {
      width: 100%; padding: 15px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #00e5a0 0%, #00b87a 100%);
      color: #0a0e17;
      font-family: 'Outfit', sans-serif;
      font-size: 16px; font-weight: 700;
      letter-spacing: 0.5px; cursor: pointer;
      position: relative; overflow: hidden;
      transition: transform 0.15s, box-shadow 0.3s;
      -webkit-appearance: none;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,229,160,0.35);
    }
    .btn-login:active { transform: translateY(0) scale(0.98); }
    .btn-login::after {
      content: '';
      position: absolute; top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
      transform: translateX(-100%);
    }
    .btn-login:hover::after { animation: sheen 0.6s ease forwards; }
    @keyframes sheen { to { transform: translateX(100%); } }

    .btn-login .spinner {
      display: none; width: 20px; height: 20px;
      border: 2.5px solid rgba(10,14,23,0.3);
      border-top-color: #0a0e17;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    .btn-login.loading .btn-text { display: none; }
    .btn-login.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .field-error {
      font-size: 12px; color: var(--error);
      margin-top: 4px; padding-left: 2px;
      min-height: 0; max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease, margin 0.25s ease;
    }
    .field-error.visible { min-height: 16px; max-height: 20px; margin-top: 6px; }

    /* Toast */
    .toast {
      position: fixed; top: 0; left: 50%;
      transform: translateX(-50%) translateY(-100%);
      padding: 12px 20px;
      border-radius: 0 0 12px 12px;
      font-size: 13px; font-weight: 500;
      z-index: 9999;
      transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
      display: flex; align-items: center; gap: 8px;
      backdrop-filter: blur(12px);
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: rgba(0,229,160,0.15); border: 1px solid rgba(0,229,160,0.3); color: #00e5a0; }
    .toast.error { background: rgba(255,77,106,0.15); border: 1px solid rgba(255,77,106,0.3); color: #ff4d6a; }

    /* Particles */
    .particle {
      position: fixed;
      width: 3px; height: 3px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      z-index: 0;
    }

    /* Checkbox */
    .custom-check {
      appearance: none; -webkit-appearance: none;
      width: 18px; height: 18px;
      border: 1.5px solid var(--border);
      border-radius: 5px;
      background: var(--input-bg);
      cursor: pointer; position: relative;
      transition: all 0.2s; flex-shrink: 0;
    }
    .custom-check:checked { background: var(--accent); border-color: var(--accent); }
    .custom-check:checked::after {
      content: ''; position: absolute;
      left: 5px; top: 2px;
      width: 5px; height: 9px;
      border: solid #0a0e17; border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    /* Social btn */
    .social-btn {
      flex: 1; padding: 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px; background: transparent;
      color: var(--fg);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.25s;
      -webkit-appearance: none;
    }
    .social-btn:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
      transform: translateY(-1px);
    }

    .signup-link {
      color: var(--accent); text-decoration: none;
      font-weight: 600; position: relative;
      transition: color 0.2s;
    }
    .signup-link::after {
      content: ''; position: absolute;
      bottom: -2px; left: 0;
      width: 0; height: 1.5px;
      background: var(--accent);
      transition: width 0.3s;
    }
    .signup-link:hover::after { width: 100%; }

    /* Entry animation */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .anim { animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) forwards; opacity: 0; }
    .d1 { animation-delay: .08s } .d2 { animation-delay: .16s }
    .d3 { animation-delay: .24s } .d4 { animation-delay: .32s }
    .d5 { animation-delay: .40s } .d6 { animation-delay: .48s }

    @keyframes shake {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)}
      40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)}
    }

    @keyframes particleRise {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 0.3; }
      90% { opacity: 0.04; }
      100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
  <div id="particles"></div>

  <div id="toast" class="toast">
    <i id="toast-icon"></i>
    <span id="toast-msg"></span>
  </div>

  <main style="position:relative;z-index:10;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom));">

    <div class="main-grid" style="width:100%;max-width:920px;display:grid;grid-template-columns:1fr 1fr;border-radius:20px;overflow:hidden;background:rgba(17,24,39,0.65);backdrop-filter:blur(24px);border:1px solid var(--border);box-shadow:0 32px 80px rgba(0,0,0,0.5);">

      <!-- ЗҮҮН: Lottie -->
      <div class="lottie-panel" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;min-height:520px;background:linear-gradient(160deg,rgba(0,229,160,0.04) 0%,transparent 60%);">
        <div class="deco-ring" style="width:280px;height:280px;top:50%;left:50%;transform:translate(-50%,-50%);animation:bf3 8s ease-in-out infinite;"></div>
        <div class="deco-ring" style="width:180px;height:180px;top:50%;left:50%;transform:translate(-50%,-50%);animation:bf1 6s ease-in-out infinite;"></div>
        <div id="lottie-container" style="position:relative;z-index:2;"></div>
        <p class="lottie-hint anim d3" style="position:relative;z-index:10;text-align:center;margin-top:12px;color:var(--muted);font-size:12px;letter-spacing:0.3px;">
          Аюулгүй, хурдан, хялбар нэвтрэлт
        </p>
      </div>

      <!-- БАРУУН: Форм -->
      <div class="form-panel" style="display:flex;flex-direction:column;justify-content:center;padding:36px 32px;">

        <div class="anim d1" style="margin-bottom:24px;">
          <h1 style="font-family:'Outfit',sans-serif;font-size:30px;font-weight:800;line-height:1.15;letter-spacing:-0.5px;">Welcome Back</h1>
          <p class="sub-text" style="margin-top:6px;color:var(--muted);font-size:13px;font-weight:300;">Тавтай морилно уу. Мэдээллээ оруулна уу.</p>
        </div>

        <form id="loginForm" novalidate autocomplete="off">
          <div class="anim d2" style="margin-bottom:2px;">
            <label style="display:block;margin-bottom:6px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0.4px;text-transform:uppercase;">Email</label>
            <div class="input-wrap" style="position:relative;">
              <i class="input-icon fa-regular fa-envelope"></i>
              <input type="email" id="email" class="input-field" placeholder="name@example.com" />
            </div>
            <div class="field-error" id="emailErr"></div>
          </div>

          <div class="anim d3" style="margin-bottom:4px;">
            <label style="display:block;margin-bottom:6px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0.4px;text-transform:uppercase;">Password</label>
            <div class="input-wrap" style="position:relative;">
              <i class="input-icon fa-solid fa-lock" style="font-size:13px;"></i>
              <input type="password" id="password" class="input-field" placeholder="********" />
              <button type="button" class="toggle-pw" id="togglePw" aria-label="Нууц үг харах">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <div class="field-error" id="pwErr"></div>
          </div>

          <div class="remember-row anim d4" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--muted);">
              <input type="checkbox" class="custom-check" id="remember" />
              Намайг сана
            </label>
            <a href="#" onclick="showToast('Нууц үг сэргээх линк илгээгдлээ','success');return false;"
               style="font-size:12px;color:var(--accent);text-decoration:none;font-weight:500;">Мартсан?</a>
          </div>

          <div class="anim d5">
            <button type="submit" class="btn-login" id="loginBtn">
              <span class="btn-text">LOGIN</span>
              <div class="spinner"></div>
            </button>
          </div>
        </form>

        <div class="divider-row anim d5" style="display:flex;align-items:center;gap:10px;margin:16px 0;">
          <div style="flex:1;height:1px;background:var(--border);"></div>
          <span style="font-size:11px;color:var(--muted);white-space:nowrap;">эсвэл</span>
          <div style="flex:1;height:1px;background:var(--border);"></div>
        </div>

        <div class="social-row anim d5" style="display:flex;gap:10px;margin-bottom:16px;">
          <button class="social-btn" onclick="showToast('Google-р нэвтрэх','success')">
            <i class="fa-brands fa-google"></i> Google
          </button>
          <button class="social-btn" onclick="showToast('GitHub-р нэвтрэх','success')">
            <i class="fa-brands fa-github"></i> GitHub
          </button>
        </div>

        <p class="anim d6" style="text-align:center;font-size:13px;color:var(--muted);">
          Бүртгэл байхгүй юу?
          <a href="#" class="signup-link" onclick="showToast('Бүртгэлийн хуудас руу шилжих','success');return false;">Sign Up</a>
        </p>
      </div>
    </div>
  </main>

  <script>
    // ===== Lottie =====
    const lottieSources = [
      'https://assets2.lottiefiles.com/packages/lf20_jcikwtux.json',
      'https://assets10.lottiefiles.com/packages/lf20_xlmz9xwm.json',
      'https://assets9.lottiefiles.com/packages/lf20_ky24lsxa.json',
      'https://assets4.lottiefiles.com/packages/lf20_tutvdkg0.json',
      'https://assets3.lottiefiles.com/packages/lf20_UJNc2t.json'
    ];
    let lottieAnim = null, srcIdx = 0;

    function loadLottie(url) {
      const c = document.getElementById('lottie-container');
      c.innerHTML = '';
      if (lottieAnim) { lottieAnim.destroy(); lottieAnim = null; }
      lottieAnim = lottie.loadAnimation({ container: c, renderer: 'svg', loop: true, autoplay: true, path: url });
      lottieAnim.addEventListener('data_failed', () => {
        srcIdx++;
        srcIdx < lottieSources.length
          ? loadLottie(lottieSources[srcIdx])
          : (c.innerHTML = '<div style="text-align:center"><i class="fa-solid fa-laptop-code" style="font-size:60px;color:var(--accent);filter:drop-shadow(0 0 20px rgba(0,229,160,0.4));"></i></div>');
      });
      lottieAnim.addEventListener('data_ready', () => {
        const svg = c.querySelector('svg');
        if (svg) { svg.style.opacity = '0'; svg.style.transition = 'opacity 0.5s'; requestAnimationFrame(() => svg.style.opacity = '1'); }
      });
    }
    loadLottie(lottieSources[0]);

    // ===== Toggle PW =====
    const togglePw = document.getElementById('togglePw');
    const pwInput = document.getElementById('password');
    togglePw.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      togglePw.innerHTML = show ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
    });

    // ===== Validation =====
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const emailErr = document.getElementById('emailErr');
    const pwErr = document.getElementById('pwErr');
    const loginBtn = document.getElementById('loginBtn');

    emailInput.addEventListener('input', () => { if (emailInput.classList.contains('error')) vEmail(false); });
    pwInput.addEventListener('input', () => { if (pwInput.classList.contains('error')) vPw(false); });

    function vEmail(show = true) {
      const v = emailInput.value.trim();
      if (!v) { if (show) { emailErr.textContent = 'И-мэйл оруулна уу'; emailErr.classList.add('visible'); emailInput.classList.add('error'); } return false; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { if (show) { emailErr.textContent = 'Зөв и-мэйл биш'; emailErr.classList.add('visible'); emailInput.classList.add('error'); } return false; }
      emailErr.textContent = ''; emailErr.classList.remove('visible'); emailInput.classList.remove('error'); return true;
    }
    function vPw(show = true) {
      const v = pwInput.value;
      if (!v) { if (show) { pwErr.textContent = 'Нууц үг оруулна уу'; pwErr.classList.add('visible'); pwInput.classList.add('error'); } return false; }
      if (v.length < 6) { if (show) { pwErr.textContent = 'Хамгийн багадаа 6 тэмдэгт'; pwErr.classList.add('visible'); pwInput.classList.add('error'); } return false; }
      pwErr.textContent = ''; pwErr.classList.remove('visible'); pwInput.classList.remove('error'); return true;
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const eOk = vEmail(), pOk = vPw();
      if (!eOk || !pOk) {
        if (!eOk) shakeEl(emailInput);
        if (!pOk) shakeEl(pwInput);
        return;
      }
      loginBtn.classList.add('loading'); loginBtn.disabled = true;
      setTimeout(() => {
        loginBtn.classList.remove('loading'); loginBtn.disabled = false;
        emailInput.value.trim() === 'demo@test.com' && pwInput.value === 'demo123'
          ? showToast('Амжилттай нэвтэрлээ!', 'success')
          : showToast('И-мэйл эсвэл нууц үг буруу', 'error');
      }, 1600);
    });

    function shakeEl(el) {
      el.style.animation = 'none'; el.offsetHeight;
      el.style.animation = 'shake 0.4s ease';
      setTimeout(() => el.style.animation = '', 400);
    }

    // ===== Toast =====
    function showToast(msg, type) {
      const t = document.getElementById('toast');
      const ic = document.getElementById('toast-icon');
      const m = document.getElementById('toast-msg');
      t.className = 'toast ' + type;
      ic.className = type === 'success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-xmark';
      m.textContent = msg;
      requestAnimationFrame(() => t.classList.add('show'));
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ===== Particles =====
    (function() {
      const c = document.getElementById('particles');
      for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const s = Math.random() * 2.5 + 1;
        p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;bottom:-8px;${Math.random()>0.5?'background:#0077ff;':''}animation:particleRise ${Math.random()*10+8}s ${Math.random()*8}s ease-in infinite;`;
        c.appendChild(p);
      }
    })();

    // ===== Mouse → blob =====
    document.addEventListener('mousemove', e => {
      const dx = (e.clientX - innerWidth / 2) / innerWidth;
      const dy = (e.clientY - innerHeight / 2) / innerHeight;
      document.querySelector('.blob-1').style.transform = `translate(${dx*20}px,${dy*15}px)`;
      document.querySelector('.blob-2').style.transform = `translate(${dx*-15}px,${dy*-10}px)`;
    });

    // Enter → password focus
    emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); pwInput.focus(); } });
  </script>
</body>
</html>
